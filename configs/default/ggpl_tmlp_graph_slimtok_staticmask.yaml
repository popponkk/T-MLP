model:
  model_name: ggpl_tmlp_graph_slimtok_staticmask
  base_model: ggpl_tmlp_graph_slimtok_staticmask
  n_layers: 1
  d_token: 1024
  token_bias: true
  d_ffn_factor: 0.66
  ffn_dropout: null
  residual_dropout: 0.1
  num_breakpoints: 8
  learnable_breakpoints: true
  breakpoint_init: gbdt
  breakpoint_fallback: quantile
  breakpoint_cache_dir: "artifacts/ggpl_tmlp_graph_slimtok_staticmask_breakpoints"
  slimtok_channel_ratio: 2.0
  slimtok_dropout: null
  slimtok_layerscale_init: 1.0e-2
  slimtok_activation: gelu
  graph_dynamic_rank: 16
  graph_temperature: 1.0
  graph_dynamic_scale_init: 1.0e-2
  graph_self_loop_init: 2.0
  staticmask_topk: null
  debug_staticmask: false

training:
  max_epoch: 300
  optimizer: adamw
  lr: 1.0e-5
  weight_decay: 1.0e-5
  batch_size: 32
  early_stop: 20
