model:
  model_name: "hingemix"
  base_model: "ggpl_tmlp"
  n_layers: 1
  d_token: 1024
  token_bias: true
  d_ffn_factor: 0.66
  ffn_dropout: null
  residual_dropout: 0.1
  num_breakpoints: 8
  # The runner overrides this and assigns an isolated cache identity per task.
  breakpoint_strategy: "gbdt"
  breakpoint_init: "gbdt"
  breakpoint_fallback: "quantile"
  breakpoint_cache_dir: "artifacts/hingemix_breakpoint_ablation"
  breakpoint_cache_key: null
  learnable_breakpoints: true
  graph_dynamic_rank: 16
  graph_temperature: 16.0
  slimtok_channel_ratio: 2.0
  slimtok_dropout: null
  slimtok_layerscale_init: 0.01
  slimtok_activation: "gelu"

training:
  lr: 1.0e-5
  weight_decay: 0.0
  optimizer: "adamw"
  batch_size: 32
