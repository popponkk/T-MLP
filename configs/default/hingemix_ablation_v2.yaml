model:
  model_name: hingemix_ablation_v2
  base_model: ggpl_tmlp
  ablation: full
  n_layers: 1
  d_token: 1024
  token_bias: true
  d_ffn_factor: 0.66
  ffn_dropout: null
  residual_dropout: 0.1
  num_breakpoints: 8
  breakpoint_init: "gbdt"
  breakpoint_fallback: "quantile"
  breakpoint_cache_dir: "artifacts/hingemix_ablation_v2_breakpoints"
  learnable_breakpoints: true
  graph_dynamic_rank: 16
  graph_temperature: 16.0
  token_mlp_ratio: 2.0
  slimtok_channel_ratio: 2.0
  slimtok_dropout: null
  slimtok_layerscale_init: 1.0e-2
  slimtok_activation: "gelu"

training:
  lr: 1.0e-5
  weight_decay: 0.0
  optimizer: "adamw"
  batch_size: 32
